<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leet Matric</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="leetcode.svg" type="image/x-icon">

</head>

<body>

    <div class="container">
        <!-- heading
        user
        stats -->
        <h1>Leet Matric</h1>
        <div class="user-container">
            <p>Enter your username: </p>
            <div class="user-input-container">
                <input type="text" placeholder="enter your name here" id="user-input">
                <button id="search-btn">Search</button>
            </div>

        </div>
        <div class="stats-container">

            <div class="progress">
                <div class="progress-item circle">
                    <div class="easy-progress">
                        <span id="easy-label">
                            Easy
                        </span>
                    </div>
                </div>
                <div class="progress-item circle">
                    <div class="medium-progress">
                        <span id="medium-label">
                            Medium
                        </span>
                    </div>
                </div>
                <div class="progress-item circle">
                    <div class="hard-progress">
                        <span id="hard-label">
                            Hard
                        </span>
                    </div>
                </div>
          
                  </div>
                    <div class="stats-card">
                        <!-- directly populate card here from JS code -->

                    </div>
                    </div>
                

            </div>

            <script src="script.js"></script>
</body>

</html>
